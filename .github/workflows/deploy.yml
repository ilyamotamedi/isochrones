name: Deploy

# Preview channel for pull requests, live for main. Both build from the same
# job definition below so a preview cannot be built differently from what ships.
on:
  push:
    branches: [main]
  pull_request:
  # Re-deploying after a secret or a Mapbox token restriction changes needs no
  # code change, so it should not need an empty commit either.
  workflow_dispatch:

jobs:
  # Whether this repository can deploy at all.
  #
  # Secrets cannot be read in a job-level `if`, so the question has to be
  # answered inside a step and passed on as an output. The alternative — letting
  # the deploy action discover the missing input for itself — turns every push
  # into a failed run, which trains people to ignore the badge.
  credentials:
    runs-on: ubuntu-latest
    outputs:
      deployable: ${{ steps.probe.outputs.deployable }}
    steps:
      - id: probe
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
        run: |
          missing=""
          [ -n "$SERVICE_ACCOUNT" ] || missing="$missing FIREBASE_SERVICE_ACCOUNT"
          [ -n "$MAPBOX_TOKEN" ] || missing="$missing VITE_MAPBOX_TOKEN"

          if [ -n "$missing" ]; then
            echo "deployable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Deploy skipped. Missing repository secrets:$missing"
          else
            echo "deployable=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The gates first. `npm run build` runs tsc itself, but running these
      # separately means a failure says which one, rather than "build failed".
      - run: npm run typecheck
      - run: npm test -- --run

      # The Playwright harness is deliberately not here. It needs a running dev
      # server and takes 3-4 minutes; it stays a local pre-release step.

      - run: npm run build
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          # Not a secret — it travels in every request the tag makes — but it
          # is per-property, so it stays out of the source. Absent, the build
          # succeeds and analytics simply never starts; see src/analytics.
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  preview:
    # Skipped for pull requests from forks: they cannot read secrets, so the
    # build would ship without a Mapbox token and the deploy would fail anyway.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.credentials.outputs.deployable == 'true'
    needs: [credentials, build]
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: isochrones-4f3fa
          expires: 7d

  live:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      needs.credentials.outputs.deployable == 'true'
    needs: [credentials, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: isochrones-4f3fa
          channelId: live
